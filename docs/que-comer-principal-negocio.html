<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Qué Comer Negocio</title>
</head>
<body>
<script>
function qcB64uEncode(data){
  try{return btoa(JSON.stringify(data)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}catch(e){return''}
}
function qcB64uDecode(value){
  try{
    let s=String(value||'').replace(/-/g,'+').replace(/_/g,'/');
    while(s.length%4)s+='=';
    return JSON.parse(atob(s));
  }catch(e){return null}
}
function qcPersistBootstrap(){
  try{
    const p=new URLSearchParams(location.search);
    let data=qcB64uDecode(p.get('qci'));
    if(!data){
      const db=(p.get('qcdb')||p.get('db')||'').trim().replace(/\/+$/,'');
      if(db||p.get('biz')||p.get('newbiz'))data={
        qcdb:db,
        qcf:p.get('qcf'),
        qcl:p.get('qcl'),
        biz:p.get('biz')||'',
        newbiz:p.get('newbiz')||'0'
      };
    }
    if(!data)return;
    const db=String(data.qcdb||'').trim().replace(/\/+$/,'');
    if(db){
      localStorage.setItem('qc_platform_db',db);
      localStorage.setItem('qc_db_url',db);
      localStorage.setItem('qc_business_runtime_db',db);
      localStorage.setItem('qc_admin_db_url',db);
    }
    if(data.qcf!==undefined&&data.qcf!==null&&Number.isFinite(Number(data.qcf)))localStorage.setItem('qc_platform_fee_v08',String(Number(data.qcf)));
    if(data.qcl!==undefined&&data.qcl!==null&&Number.isFinite(Number(data.qcl)))localStorage.setItem('qc_loyalty_pct',String(Number(data.qcl)));
    if(data.biz)localStorage.setItem('qc_last_business_id',String(data.biz));

    // Entrega los datos al core aunque la app instalada tenga almacenamiento aislado.
    window.name='QC_BOOT_V1:'+encodeURIComponent(JSON.stringify(data));

    // Deja un enlace opaco y persistente para "Agregar a pantalla de inicio".
    // newbiz es de un solo uso: el core lo recibe ahora, pero no se repite en futuros arranques.
    const persistent={...data,newbiz:'0'};
    const token=qcB64uEncode(persistent);
    if(token){
      p.set('qci',token);
      ['qcdb','db','qcf','qcl','biz','newbiz'].forEach(k=>p.delete(k));
      const qs=p.toString();
      history.replaceState(null,'',location.pathname+(qs?'?'+qs:'')+location.hash);
    }
  }catch(e){}
}
qcPersistBootstrap();

const qcAutoUpdate=()=>{
  if(!('serviceWorker' in navigator))return;
  let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(reloading)return;
    reloading=true;
    location.reload();
  });
  const check=async()=>{
    try{
      const reg=await navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'});
      await reg.update().catch(()=>{});
      if(reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'});
    }catch(e){}
  };
  check();
  window.addEventListener('focus',check);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check()});
  setInterval(check,60000);
};
qcAutoUpdate();

(async()=>{
  try{
    const r=await fetch("https://raw.githubusercontent.com/Quecomerhoy/central-que-comer/main/docs/_core/que-comer-principal-negocio-core.html?v=1.18.0",{cache:'no-store'});
    if(!r.ok)throw new Error('No se pudo cargar el visor');
    let html=await r.text();
    html=html.replace(/<link\s+rel=[\"']manifest[\"'][^>]*>\s*/ig,'');
    const changes=[["<div class=\"modalhead\"><h3>Activación del visor de negocio</h3></div>", "<div class=\"modalhead\"><h3>Registrar negocio</h3></div>"], ["<div class=\"notice\" id=\"activationNotice\"><b>Este visor todavía no está autorizado.</b> Llena los datos de la sucursal y envía la solicitud. El acceso se habilita únicamente cuando Control de Sistema Qué Comer!! la apruebe.</div>", "<div class=\"notice\" id=\"activationNotice\"><b>Registrar negocio.</b> Ingresa los datos del establecimiento para solicitar su activación.</div>"], ["    <div class=\"field\"><label>Identificador de este visor</label><div class=\"activation-code\" id=\"viewerDeviceId\"></div></div>\n", ""], ["async function req(path,opts={}){if(!A.dbUrl)throw new Error('Abre este visor desde Control de Sistema Qué Comer!!');", "async function req(path,opts={}){if(!A.dbUrl)throw new Error('No se pudo conectar al sistema central. Intenta nuevamente.');"], ["function updateBusinessView(){const name=A.accessStatus==='active'?(A.businessName||'Tu establecimiento'):'Activación requerida';", "function updateBusinessView(){const name=A.accessStatus==='active'?(A.businessName||'Tu establecimiento'):'Registrar negocio';"], ["if(!A.dbUrl)$('#businessInfoView').textContent='Este visor necesita la conexión generada por Control de Sistema Qué Comer!! o el enlace compartible del visor de negocio.';else if(A.accessStatus!=='active')$('#businessInfoView').textContent='🔒 Este visor no puede administrar el negocio hasta ser activado desde Control de Sistema Qué Comer!!.';", "if(!A.dbUrl)$('#businessInfoView').textContent='Registra tu negocio para comenzar.';else if(A.accessStatus!=='active')$('#businessInfoView').textContent='Registra tu negocio para comenzar.';"], ["function showActivationGate(message,type='pending'){A.accessStatus=type==='active'?'active':type;updateBusinessView();$('#viewerDeviceId').textContent=A.deviceId;", "function showActivationGate(message,type='pending'){A.accessStatus=type==='active'?'active':type;updateBusinessView();"], ["if(!A.dbUrl){A.accessStatus='no-connection';showActivationGate('<b>Sin conexión.</b> Abre el enlace compartible generado en Control de Sistema Qué Comer!!.','no-connection');setConn(false,'Abre desde Control de Sistema');return false}", "if(!A.dbUrl){A.accessStatus='no-connection';showActivationGate('<b>Registrar negocio.</b> Ingresa los datos del establecimiento para comenzar.','new');setConn(false,'Registrar negocio');return false}"], ["showActivationGate('<b>Activación requerida.</b> Llena los datos de la sucursal y envía la solicitud. El administrador deberá aprobar este visor desde Control de Sistema Qué Comer!!.','new');setConn(false,'Requiere activación');return false", "showActivationGate('<b>Registrar negocio.</b> Ingresa los datos del establecimiento y envía la solicitud.','new');setConn(false,'Registrar negocio');return false"], ["$('#requestActivation').onclick=async()=>{if(!A.dbUrl){toast('Abre este visor desde Control de Sistema Qué Comer!!');return}", "$('#requestActivation').onclick=async()=>{if(!A.dbUrl){toast('No se pudo conectar al sistema central. Intenta nuevamente.');return}"]];
    for(const [from,to] of changes)html=html.split(from).join(to);
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML='<main style="font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:560px;margin:80px auto;padding:24px"><h2>No se pudo cargar Qué Comer</h2><p>Intenta nuevamente en unos momentos.</p><button onclick="location.reload()" style="padding:10px 14px;border:0;border-radius:10px;background:#ff6b35;color:#fff;font-weight:700">Reintentar</button></main>';
  }
})();
</script>
</body>
</html>
