<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101828">
<title>Control de Sistema Qué Comer!!</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f5f7;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}#qcFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f3f5f7;visibility:hidden}#qcLoading{position:fixed;inset:0;display:grid;place-items:center;color:#344054;background:#f3f5f7;font-weight:800}#qcLoading>div{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:18px 22px;box-shadow:0 12px 34px rgba(16,24,40,.08)}
</style>
</head>
<body>
<div id="qcLoading"><div>Abriendo Control de Qué Comer…</div></div>
<iframe id="qcFrame" title="Control de Sistema Qué Comer" src="./_core/control-sistema-que-comer-core.html?v=1.18.5"></iframe>
<script>
(function(){
  const frame=document.getElementById('qcFrame'),loading=document.getElementById('qcLoading');
  function registerSW(){if(!('serviceWorker' in navigator))return;navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'}).then(r=>r.update().catch(()=>{})).catch(()=>{})}
  registerSW();window.addEventListener('focus',registerSW);
  frame.addEventListener('load',()=>{
    try{
      const d=frame.contentDocument;
      const dash=d.createElement('script');dash.src='../dashboard-v1.18.js?v=1.18.5';dash.async=false;
      dash.onload=()=>{
        const modules=d.createElement('script');modules.src='../control-modules-v1.18.2.js?v=1.18.5';modules.async=false;
        modules.onload=()=>{frame.style.visibility='visible';loading.style.display='none'};
        modules.onerror=()=>{loading.innerHTML='<div>No se pudieron cargar los módulos. Recarga la página.</div>'};
        d.body.appendChild(modules);
      };
      dash.onerror=()=>{loading.innerHTML='<div>No se pudo cargar el Dashboard. Recarga la página.</div>'};
      d.body.appendChild(dash);
    }catch(e){loading.innerHTML='<div>No se pudo iniciar el Control central. Recarga la página.</div>'}
  });
})();
</script>
</body>
</html>
