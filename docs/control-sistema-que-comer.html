<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Control de Sistema Qué Comer!!</title>
</head>
<body>
<script>
const qcControlAutoUpdate=()=>{
  if(!('serviceWorker' in navigator))return;
  let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloading)return;reloading=true;location.reload()});
  const check=async()=>{try{const reg=await navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'});await reg.update().catch(()=>{});if(reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'})}catch(e){}};
  check();window.addEventListener('focus',check);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check()});setInterval(check,60000);
};
qcControlAutoUpdate();
(async()=>{
  try{
    const r=await fetch('https://raw.githubusercontent.com/Quecomerhoy/central-que-comer/main/docs/_core/control-sistema-que-comer-core.html?v=1.18.2',{cache:'no-store'});
    if(!r.ok)throw new Error('No se pudo cargar Control central');
    let html=await r.text();
    html=html.replace('</body>','<script src="dashboard-v1.18.js?v=1.18.2"><\/script><script src="control-modules-v1.18.2.js?v=1.18.2"><\/script></body>');
    document.open();document.write(html);document.close();
  }catch(e){
    document.body.innerHTML='<main style="font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:620px;margin:80px auto;padding:24px"><h2>No se pudo cargar Control de Qué Comer</h2><p>Verifica tu conexión e intenta nuevamente.</p><button onclick="location.reload()" style="padding:10px 14px;border:0;border-radius:10px;background:#ff6b35;color:#fff;font-weight:700">Reintentar</button></main>';
  }
})();
</script>
</body>
</html>
