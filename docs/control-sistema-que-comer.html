<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101828">
<link rel="manifest" href="manifest-control.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="assets/que-comer-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/que-comer-icon-192.png">
<title>Control de Sistema Qué Comer!!</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f5f7;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#qcFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f3f5f7}
#qcLoading{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#f3f5f7;color:#344054;font-weight:850}
#qcLoading>div{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:18px 22px;box-shadow:0 12px 34px rgba(16,24,40,.08)}
</style>
</head>
<body>
<div id="qcLoading"><div>Abriendo Control de Qué Comer…</div></div>
<iframe id="qcFrame" title="Control de Sistema Qué Comer" src="./_core/control-sistema-que-comer-core.html?v=1.18.9"></iframe>
<script>
(()=>{
  const frame=document.getElementById('qcFrame'),loading=document.getElementById('qcLoading');
  const registerSW=()=>{if(!('serviceWorker' in navigator))return;navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'}).then(r=>r.update().catch(()=>{})).catch(()=>{})};
  registerSW();window.addEventListener('focus',registerSW);
  async function inject(doc,url){
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok)throw new Error(url+' · '+r.status);
    const s=doc.createElement('script');
    s.textContent=await r.text();
    doc.body.appendChild(s);
  }
  frame.addEventListener('load',async()=>{
    loading.style.display='none';
    try{
      const w=frame.contentWindow,d=frame.contentDocument;
      if(w&&w.C){
        w.centralBaseUrl=()=>new URL('../',w.location.href).href;
        w.centralViewerUrl=file=>new URL('../'+file,w.location.href).href;
        try{w.syncCentralViewerUrls()}catch(e){}
      }
      try{await inject(d,'./dashboard-v1.18.js?v=1.18.9')}catch(e){console.warn('Dashboard no cargado; Control base continúa disponible',e)}
      try{await inject(d,'./control-modules-v1.18.2.js?v=1.18.9')}catch(e){console.warn('Módulos no cargados; Control base continúa disponible',e)}
    }catch(e){console.warn('El Control base continúa disponible',e)}
  });
  setTimeout(()=>{loading.style.display='none'},5000);
})();
</script>
</body>
</html>
