<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Qué Comer</title><script>
(async()=>{
  const destino='https://quecomerhoy.github.io/central-que-comer/que-comer-principal-negocio.html';
  const p=new URLSearchParams(location.search);
  try{
    if(!p.get('qcdb')&&!p.get('db')&&!p.get('qci')){var db=localStorage.getItem('qc_business_runtime_db')||localStorage.getItem('qc_platform_db')||localStorage.getItem('qc_db_url')||localStorage.getItem('qc_admin_db_url')||localStorage.getItem('qc_control_db')||'';if(db)p.set('qcdb',db)}
    if(!p.get('qcf')){var f=localStorage.getItem('qc_platform_fee_v08')||localStorage.getItem('qc_platform_fee');if(f)p.set('qcf',f)}
    if(!p.get('qcl')){var l=localStorage.getItem('qc_loyalty_pct');if(l)p.set('qcl',l)}
    if(!p.get('biz')){var b=localStorage.getItem('qc_last_business_id');if(b)p.set('biz',b)}
    if('serviceWorker' in navigator){const reg=await navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'}).catch(()=>null);if(reg)await reg.update().catch(()=>{})}
    if('caches' in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}
  }catch(e){}
  const qs=p.toString();location.replace(destino+(qs?'?'+qs:'')+(location.hash||''));
})();
</script></head><body style="font-family:system-ui,sans-serif;padding:24px">Actualizando y abriendo Qué Comer…</body></html>
