<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Qué Comer Hoy</title>
</head>
<body>
<script>
function qcB64uEncode(data){
  try{return btoa(JSON.stringify(data)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}catch(e){return''}
}
function qcB64uDecode(value){
  try{
    let s=String(value||'').replace(/-/g,'+').replace(/_/g,'/');
    while(s.length%4)s+='=';
    return JSON.parse(atob(s));
  }catch(e){return null}
}
function qcPersistBootstrap(){
  try{
    const p=new URLSearchParams(location.search);
    let data=qcB64uDecode(p.get('qci'));
    if(!data){
      const db=(p.get('qcdb')||p.get('db')||'').trim().replace(/\/+$/,'');
      if(db||p.get('biz')||p.get('newbiz'))data={qcdb:db,qcf:p.get('qcf'),qcl:p.get('qcl'),biz:p.get('biz')||'',newbiz:p.get('newbiz')||'0'};
    }
    if(!data)return;
    const db=String(data.qcdb||'').trim().replace(/\/+$/,'');
    if(db){
      localStorage.setItem('qc_platform_db',db);
      localStorage.setItem('qc_db_url',db);
      localStorage.setItem('qc_business_runtime_db',db);
      localStorage.setItem('qc_admin_db_url',db);
    }
    if(data.qcf!==undefined&&data.qcf!==null&&Number.isFinite(Number(data.qcf)))localStorage.setItem('qc_platform_fee_v08',String(Number(data.qcf)));
    if(data.qcl!==undefined&&data.qcl!==null&&Number.isFinite(Number(data.qcl)))localStorage.setItem('qc_loyalty_pct',String(Number(data.qcl)));
    if(data.biz)localStorage.setItem('qc_last_business_id',String(data.biz));
    window.name='QC_BOOT_V1:'+encodeURIComponent(JSON.stringify(data));
    const persistent={...data,newbiz:'0'};
    const token=qcB64uEncode(persistent);
    if(token){
      p.set('qci',token);
      ['qcdb','db','qcf','qcl','biz','newbiz'].forEach(k=>p.delete(k));
      const qs=p.toString();
      history.replaceState(null,'',location.pathname+(qs?'?'+qs:'')+location.hash);
    }
  }catch(e){}
}
qcPersistBootstrap();

const qcAutoUpdate=()=>{
  if(!('serviceWorker' in navigator))return;
  let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloading)return;reloading=true;location.reload()});
  const check=async()=>{
    try{
      const reg=await navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'});
      await reg.update().catch(()=>{});
      if(reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'});
    }catch(e){}
  };
  check();
  window.addEventListener('focus',check);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check()});
  setInterval(check,60000);
};
qcAutoUpdate();

(async()=>{
  try{
    const r=await fetch("https://raw.githubusercontent.com/Quecomerhoy/central-que-comer/main/docs/_core/que-comer-pedidos-core.html?v=1.18.22",{cache:'no-store'});
    if(!r.ok)throw new Error('No se pudo cargar el visor');
    let html=await r.text();
    html=html.replace(/<link\s+rel=[\"']manifest[\"'][^>]*>\s*/ig,'');
    html=html.replace('</body>','<script src="menu-analytics-v1.18.js?v=1.18.22"><\/script><script src="menu-features-v1.18.16.js?v=1.18.16"><\/script><script src="menu-fixes-v1.18.17.js?v=1.18.22"><\/script><script src="menu-order-edit-v1.18.21.js?v=1.18.22"><\/script><script src="menu-assembler-v1.18.22.js?v=1.18.22"><\/script></body>');
    const changes=[["La primera vez que uses Qué Comer!! necesitamos tus datos para identificar y entregar correctamente tus pedidos. Una vez guardados quedarán bloqueados en este navegador.", "La primera vez que uses Qué Comer!! necesitamos tus datos para identificar y entregar correctamente tus pedidos. Después los usaremos automáticamente en tus próximas compras."], ["Tus datos ya fueron registrados y están bloqueados para evitar cambios frecuentes. Se utilizarán automáticamente en tus pedidos.", "Tus datos ya están registrados y se utilizarán automáticamente en tus pedidos."], ["toast('Los datos ya están bloqueados')", "toast('Tus datos ya están registrados')"], ["toast('Datos registrados y bloqueados')", "toast('Datos registrados correctamente')"]];
    for(const [from,to] of changes)html=html.split(from).join(to);
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML='<main style="font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:560px;margin:80px auto;padding:24px"><h2>No se pudo cargar Qué Comer</h2><p>Intenta nuevamente en unos momentos.</p><button onclick="location.reload()" style="padding:10px 14px;border:0;border-radius:10px;background:#ff6b35;color:#fff;font-weight:700">Reintentar</button></main>';
  }
})();
</script>
</body>
</html>
