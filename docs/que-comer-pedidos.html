<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Qué Comer Hoy</title>
</head>
<body>
<script>
const qcAutoUpdate=()=>{
  if(!('serviceWorker' in navigator))return;
  let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(reloading)return;
    reloading=true;
    location.reload();
  });
  const check=async()=>{
    try{
      const reg=await navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'});
      await reg.update().catch(()=>{});
      if(reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'});
    }catch(e){}
  };
  check();
  window.addEventListener('focus',check);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check()});
  setInterval(check,60000);
};
qcAutoUpdate();

(async()=>{
  try{
    const r=await fetch("https://raw.githubusercontent.com/Quecomerhoy/central-que-comer/main/docs/_core/que-comer-pedidos-core.html?v=1.17.4",{cache:'no-store'});
    if(!r.ok)throw new Error('No se pudo cargar el visor');
    let html=await r.text();
    const changes=[["La primera vez que uses Qué Comer!! necesitamos tus datos para identificar y entregar correctamente tus pedidos. Una vez guardados quedarán bloqueados en este navegador.", "La primera vez que uses Qué Comer!! necesitamos tus datos para identificar y entregar correctamente tus pedidos. Después los usaremos automáticamente en tus próximas compras."], ["Tus datos ya fueron registrados y están bloqueados para evitar cambios frecuentes. Se utilizarán automáticamente en tus pedidos.", "Tus datos ya están registrados y se utilizarán automáticamente en tus pedidos."], ["toast('Los datos ya están bloqueados')", "toast('Tus datos ya están registrados')"], ["toast('Datos registrados y bloqueados')", "toast('Datos registrados correctamente')"]];
    for(const [from,to] of changes)html=html.split(from).join(to);
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML='<main style="font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:560px;margin:80px auto;padding:24px"><h2>No se pudo cargar Qué Comer</h2><p>Intenta nuevamente en unos momentos.</p><button onclick="location.reload()" style="padding:10px 14px;border:0;border-radius:10px;background:#ff6b35;color:#fff;font-weight:700">Reintentar</button></main>';
  }
})();
</script>
</body>
</html>
