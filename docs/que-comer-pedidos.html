<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff6b35">
<link rel="apple-touch-icon" sizes="180x180" href="assets/que-comer-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/que-comer-icon-192.png">
<title>Qué Comer Hoy</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff8ef;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#menuFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff8ef}
#loader{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#fff8ef;color:#344054;font-weight:800}
#loader>div{background:#fff;border:1px solid #eadfce;border-radius:16px;padding:18px 22px;box-shadow:0 12px 34px rgba(66,45,25,.10)}
</style>
</head>
<body>
<div id="loader"><div>Abriendo Qué Comer Hoy…</div></div>
<iframe id="menuFrame" title="Qué Comer Hoy"></iframe>
<script>
(()=>{
  const VERSION='1.19.0';
  function decode(value){try{let s=String(value||'').replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(atob(s))}catch(e){return null}}
  function encode(data){try{return btoa(JSON.stringify(data)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}catch(e){return''}}
  function persistConnection(){
    try{
      const p=new URLSearchParams(location.search);let data=decode(p.get('qci'));
      if(!data){const db=String(p.get('qcdb')||p.get('db')||'').trim().replace(/\/+$/,'');if(db||p.get('biz')||p.get('newbiz'))data={qcdb:db,qcf:p.get('qcf'),qcl:p.get('qcl'),biz:p.get('biz')||'',newbiz:p.get('newbiz')||'0'}}
      if(!data)return;
      const db=String(data.qcdb||'').trim().replace(/\/+$/,'');
      if(db){localStorage.setItem('qc_platform_db',db);localStorage.setItem('qc_db_url',db);localStorage.setItem('qc_business_runtime_db',db);localStorage.setItem('qc_admin_db_url',db)}
      if(data.qcf!=null&&Number.isFinite(Number(data.qcf)))localStorage.setItem('qc_platform_fee_v08',String(Number(data.qcf)));
      if(data.qcl!=null&&Number.isFinite(Number(data.qcl)))localStorage.setItem('qc_loyalty_pct',String(Number(data.qcl)));
      if(data.biz)localStorage.setItem('qc_last_business_id',String(data.biz));
      const token=encode({...data,newbiz:'0'});if(token){p.set('qci',token);['qcdb','db','qcf','qcl','biz','newbiz'].forEach(k=>p.delete(k));history.replaceState(null,'',location.pathname+(p.toString()?'?'+p.toString():'')+location.hash)}
    }catch(e){}
  }
  persistConnection();
  const frame=document.getElementById('menuFrame'),loader=document.getElementById('loader');
  frame.src='./_core/que-comer-pedidos-core.html?v='+VERSION;
  frame.addEventListener('load',()=>{
    loader.style.display='none';
    try{
      const d=frame.contentDocument;
      const s=d.createElement('script');s.src='./menu-runtime-v1.19.0.js?v='+VERSION;s.async=false;s.onerror=()=>console.error('No se pudo cargar el runtime limpio del menú');d.body.appendChild(s);
    }catch(e){console.error('No se pudo inicializar Qué Comer Hoy',e)}
  });
  setTimeout(()=>{loader.style.display='none'},6000);
  if('serviceWorker' in navigator){
    let reloading=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloading)return;reloading=true;location.reload()});
    const check=async()=>{try{const reg=await navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'});await reg.update().catch(()=>{});if(reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'})}catch(e){}};
    check();window.addEventListener('focus',check);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check()});setInterval(check,60000);
  }
})();
</script>
</body>
</html>
